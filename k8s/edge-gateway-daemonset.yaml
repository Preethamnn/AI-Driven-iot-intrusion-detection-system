apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-gateway
  namespace: iot-ids
  labels:
    app: edge-gateway
    component: capture
spec:
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
        component: capture
    spec:
      serviceAccountName: edge-gateway
      hostNetwork: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: edge-gateway
        image: iot-ids/edge-gateway:latest
        imagePullPolicy: Always
        env:
        - name: CONFIG_PATH
          value: /app/config/config.yml
        - name: AI_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: edge-gateway-config
              key: ai_service_url
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: edge-gateway-config
      - name: data
        hostPath:
          path: /var/lib/iot-ids/edge-data
          type: DirectoryOrCreate
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-gateway
  namespace: iot-ids
