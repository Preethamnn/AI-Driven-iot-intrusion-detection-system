# Minimal AI Inference Service Configuration
# For testing optimized Isolation Forest model without external dependencies

ai_inference:
  # Machine Learning Models Configuration (with optimized Isolation Forest)
  models:
    # Optimized Isolation Forest for unsupervised anomaly detection
    isolation_forest:
      enabled: true
      contamination: 0.25     # Optimized: Higher contamination for better accuracy
      n_estimators: 100       # Optimized: 100 estimators
      max_samples: 0.9        # Optimized: 90% sampling
      random_state: 42
    
    # XGBoost for supervised classification
    xgboost:
      enabled: true
      max_depth: 6
      learning_rate: 0.1
      n_estimators: 100
      objective: "binary:logistic"
      eval_metric: "auc"
    
    # Disabled models for minimal setup
    catboost:
      enabled: false
    sequence_models:
      enabled: false
  
  # Feature Engineering Configuration
  feature_engineering:
    time_window_minutes: 5
    aggregation_functions:
      - mean
      - std
      - min
      - max
      - count
      - sum
    scaling_method: "robust"  # Optimized: RobustScaler performs best
    feature_importance_threshold: 0.01
  
  # Hybrid Decision Engine Configuration
  decision_engine:
    signature_weight: 0.6
    ml_weight: 0.4
    threshold_low: 0.3
    threshold_medium: 0.5
    threshold_high: 0.7
    threshold_critical: 0.9
  
  # API Configuration
  api:
    host: "0.0.0.0"
    rest_port: 8000
    grpc_port: 50051
    workers: 2
    max_batch_size: 100
    timeout_seconds: 30

# Minimal Storage Configuration (no external dependencies)
storage:
  type: "memory"  # Use in-memory storage for testing
  
# MLOps Configuration (minimal)
mlops:
  model_registry:
    backend: "local"
    path: "/app/models"
  
  drift_monitoring:
    enabled: false  # Disabled for minimal setup

# Security Configuration (minimal)
security:
  tls:
    enabled: false
  authentication:
    enabled: false
  rate_limiting:
    enabled: true
    requests_per_minute: 1000

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: "stdout"
  file_path: "/app/logs/ai-service.log"
  max_file_size_mb: 100
  backup_count: 5