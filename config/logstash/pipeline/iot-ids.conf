input {
  # Receive data from edge gateways
  beats {
    port => 5044
    ssl => false
  }
  
  # HTTP input for direct submissions
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  
  # Add GeoIP information for external IPs
  if [destination_ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {
    geoip {
      source => "destination_ip"
      target => "destination_geo"
    }
  }
  
  # Enrich with device information
  if [device_id] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "iot-ids-devices-*"
      query => "device_id:%{[device_id]}"
      fields => {
        "device_type" => "device_type"
        "vendor_oui" => "vendor_oui"
      }
    }
  }
  
  # Calculate threat severity level
  if [threat_score] {
    ruby {
      code => '
        score = event.get("threat_score")
        if score >= 0.9
          event.set("severity_level", "critical")
        elsif score >= 0.7
          event.set("severity_level", "high")
        elsif score >= 0.5
          event.set("severity_level", "medium")
        elsif score >= 0.3
          event.set("severity_level", "low")
        else
          event.set("severity_level", "info")
        end
      '
    }
  }
  
  # Add tags based on attack category
  if [attack_category] {
    mutate {
      add_tag => ["attack_%{attack_category}"]
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => ["@version", "host"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "iot-ids-%{[@metadata][type]}-%{+YYYY.MM.dd}"
    document_id => "%{[flow_id]}"
  }
  
  # Send high severity alerts to separate index
  if [severity_level] in ["critical", "high"] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "iot-ids-alerts-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output (disable in production)
  # stdout {
  #   codec => rubydebug
  # }
}
